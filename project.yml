name: IROViewer

options:
  bundleIdPrefix: dev.iroviewer
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  IROViewer:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: IRO 记录仪
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: 需要访问局域网中的行车记录仪，读取并连续播放视频文件。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.iroviewer.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"

schemes:
  IROViewer:
    build:
      targets:
        IROViewer: all
    run:
      config: Debug
